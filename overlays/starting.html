<script>
(function(){
 const C=window.LCS||{}, now=new Date(); let target;
 if(C.start){const [h,m]=C.start.split(':').map(Number); target=new Date(); target.setHours(h,m,0,0);}
 else if(C.minutes>0){target=new Date(now.getTime()+C.minutes*60000);}
 else {target=new Date(now); target.setSeconds(0,0); const m=target.getMinutes(); target.setMinutes(m<30?30:60); if(target-now<60000) target.setMinutes(target.getMinutes()+30);}
 const cd=document.getElementById('cd'), tx=document.getElementById('cdtxt'), note=document.getElementById('cdnote');
 function tick(){let s=Math.round((target-new Date())/1000);
  if(s<=0){cd.textContent='LIVE';tx.textContent='now';note.textContent='// starting any second...';return;}
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60, p=n=>String(n).padStart(2,'0');
  const t=(h?h+':'+p(m):p(m))+':'+p(sec); cd.textContent=t; tx.textContent=t;}
 tick(); setInterval(tick,250);
})();
</script><script src="common.js"></script></body></html>
